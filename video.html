<!DOCTYPE html>

<html>
    <head>
        <title>Videos</title>
    </head>
    <body>
        <h1>Videos</h1>
        <p>This is how to add videos to your webpage</p>
        <h3>This is how to add a video</h3>
        <video controls width="400" muted>
            <source src="assets/video/mic_test.mp4" type="video/mp4">
        </video>

        <h3>And for said video, you can add a poster image</h3>
        <video controls poster="assets/images/poster.jpg" height="400" muted>
            <source src="assets/video/mic_test.mp4" type="video/mp4">
        </video>

        <h3>Can we embed a youtube video?</h3>
        <p>If you want to embed a youtube video, youtube gives the code for it. It just won't work if it ain't a server.</p>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/9fvETktnaRw" allowfullscreen></iframe>
    </body>
</html>
