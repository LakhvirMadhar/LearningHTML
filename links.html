<!DOCTYPE html>

<html>
    <head>
        <title>Links</title>
    </head>
    <body>
        <h2>Time for Links!</h2>
        <p>We use <code>&lt;a&gt;</code> tags for links, which are anchor.</p>
        <p>We also use a <code>&lt;href&gt;</code> tags after <code>&lt;a&gt;</code> to place the reference we are attachings.</p>
        <p>This is an attribute, which can come in many tags</p>
        <a href="https://www.google.com">Click here to go to Google directly, leaving this page</a>
        <br>
        <br>
        <a href="https://www.google.com" target="_blank">
            This will open Google in a new tab!
        </a>
    </body>
</html>
